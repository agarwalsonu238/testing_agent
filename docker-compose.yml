# testing_agent — local full stack (FastAPI backend + Next.js frontend)
#
#   cp backend/.env.example backend/.env
#   docker compose up --build
#
# Dashboard: http://localhost:4000   Backend: http://localhost:8400/docs
#
# The backend image includes Claude Code, Node (for Playwright MCP) and a browser, so agent
# runs and Quick Scan both work in the container too — but Claude Code needs to be logged in:
# set CLAUDE_CODE_OAUTH_TOKEN in backend/.env (from `claude setup-token`, run locally) since
# there's no interactive terminal inside the container for the normal subscription login.
# See the repo README for deploying this same image (Render, etc.).

services:
  # ── FastAPI backend ──────────────────────────────────
  api:
    build:
      context: ./backend
    image: testing-agent-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8400:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      CORS_ORIGINS: '["http://localhost:4000"]'

  # ── Next.js frontend ─────────────────────────────────
  web:
    build:
      context: ./frontend
      args:
        # Browser-facing URL of the API (baked into the bundle at build time)
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8400
    image: testing-agent-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:3000"
    depends_on:
      - api
