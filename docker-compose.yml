# testing_agent — local full stack (FastAPI backend + Next.js frontend)
#
#   cp backend/.env.example backend/.env
#   docker compose up --build
#
# Dashboard: http://localhost:4000   Backend: http://localhost:8400/docs
#
# Containers serve the dashboard only. Agent runs need Claude Code logged in on your machine and
# Quick Scan needs a local browser, so use ./run-local-dev.sh for real QA runs.

services:
  # ── FastAPI backend ──────────────────────────────────
  api:
    build:
      context: ./backend
    image: testing-agent-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8400:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      CORS_ORIGINS: '["http://localhost:4000"]'

  # ── Next.js frontend ─────────────────────────────────
  web:
    build:
      context: ./frontend
      args:
        # Browser-facing URL of the API (baked into the bundle at build time)
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8400
    image: testing-agent-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:3000"
    depends_on:
      - api
